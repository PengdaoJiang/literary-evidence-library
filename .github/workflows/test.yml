name: literary-compiler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s experiments/book_registry -p test_registry.py -v
      - run: python -B demo.py --out demo-output
      - run: python -B alignment_demo.py
